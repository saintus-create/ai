name: Install official Assistant UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: initialize assistant-ui via official CLI')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Initialize Assistant UI with the official CLI
        run: npx assistant-ui@latest init

      - name: Commit CLI-generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated by Assistant UI CLI."
            exit 0
          fi
          git commit -m "chore: initialize assistant-ui via official CLI"
          git push
